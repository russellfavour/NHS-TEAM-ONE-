name: sentinel_ng
description: "Sentinel NG - Crime Location Reporting System for Nigerian Communities"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  
  # HTTP & Networking
  dio: ^5.8.0+1
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  
  # Routing
  go_router: ^16.2.0
  
  # UI Components
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  
  # Maps & Location
  # NOTE: No Google Maps — the app renders OpenStreetMap tiles directly via a custom
  # widget (lib/core/widgets/osm_map.dart) using cached_network_image. Free, open source,
  # no API key or subscription required on web + mobile.
  geolocator: ^13.0.2
  
  # Image & Media
  image_picker: ^1.1.2
  video_player: ^2.9.2
  


  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  
  # Animations
  flutter_animate: ^4.5.2
  
  # Charts
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    

