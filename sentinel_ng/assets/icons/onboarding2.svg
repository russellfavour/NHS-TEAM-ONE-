<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background leaves -->
  <g opacity="0.6">
    <path d="M50,250 Q30,200 50,150 Q70,200 50,250" fill="#4CAF50"/>
    <path d="M350,250 Q370,200 350,150 Q330,200 350,250" fill="#4CAF50"/>
    <path d="M80,260 Q60,220 80,180 Q100,220 80,260" fill="#81C784"/>
    <path d="M320,260 Q340,220 320,180 Q300,220 320,260" fill="#81C784"/>
  </g>
  
  <!-- Phone -->
  <g transform="translate(150, 40)">
    <!-- Phone body -->
    <rect x="0" y="0" width="100" height="200" rx="10" fill="#424242"/>
    <!-- Screen -->
    <rect x="5" y="10" width="90" height="180" rx="5" fill="#E3F2FD"/>
    
    <!-- Map route on screen -->
    <path d="M50,160 Q40,120 50,80 Q60,40 70,30" stroke="#1976D2" stroke-width="4" fill="none"/>
    
    <!-- Route dots -->
    <circle cx="50" cy="160" r="5" fill="#1976D2"/>
    <circle cx="50" cy="80" r="3" fill="#1976D2"/>
    <circle cx="70" cy="30" r="4" fill="#4CAF50"/>
    
    <!-- Shield icon on screen -->
    <g transform="translate(70, 25)">
      <path d="M-8,-10 L8,-10 L8,2 Q8,8 0,10 Q-8,8 -8,2 Z" fill="#4CAF50"/>
      <path d="M-4,-7 L4,-7 L4,1 Q4,5 0,6 Q-4,5 -4,1 Z" fill="#FFFFFF"/>
    </g>
    
    <!-- Phone notch -->
    <rect x="35" y="2" width="30" height="8" rx="4" fill="#424242"/>
  </g>
  
  <!-- Car -->
  <g transform="translate(180, 220)">
    <!-- Car body -->
    <path d="M-40,20 Q-40,0 -30,-5 L30,-5 Q40,0 40,20 Z" fill="#FFFFFF"/>
    <!-- Car top -->
    <path d="M-20,-5 Q-15,-25 15,-25 Q25,-25 30,-5 Z" fill="#F5F5F5"/>
    <!-- Wheels -->
    <circle cx="-25" cy="25" r="8" fill="#424242"/>
    <circle cx="25" cy="25" r="8" fill="#424242"/>
    <circle cx="-25" cy="25" r="4" fill="#757575"/>
    <circle cx="25" cy="25" r="4" fill="#757575"/>
  </g>
</svg>
